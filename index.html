<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四步轉譯框架 - AI 終極詠唱生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #f59e0b; /* 陽光橘黃色 */
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

    <!-- 頂部導航列 (明亮風格) -->
    <header class="border-b border-slate-200 bg-white/80 backdrop-blur-md sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-amber-500 to-orange-500">
                四步轉譯框架 ☀️
            </h1>
            <div class="flex items-center gap-6">
                <button onclick="toggleHistory()" class="text-slate-500 hover:text-amber-500 transition flex items-center gap-2 text-sm font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    歷史紀錄
                </button>
                <button onclick="toggleSettings()" class="text-slate-500 hover:text-amber-500 transition flex items-center gap-2 text-sm font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    API 設定
                </button>
            </div>
        </div>
    </header>

    <!-- API 設定 Modal (明亮風格) -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 w-full max-w-md shadow-2xl relative">
            <h2 class="text-lg font-bold text-slate-800 mb-4">設定 Gemini API 金鑰</h2>
            <p class="text-sm text-slate-500 mb-4">安全機制運作中。金鑰僅加密儲存於本機端。</p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-slate-800 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 mb-4">
            <div class="flex justify-end gap-3">
                <button onclick="toggleSettings()" class="px-4 py-2 rounded-xl text-slate-500 hover:bg-slate-100 transition font-medium">取消</button>
                <button onclick="saveApiKey()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 rounded-xl text-white font-bold transition shadow-lg shadow-amber-500/30">儲存</button>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄面板 Modal (明亮風格) -->
    <div id="historyModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 w-full max-w-2xl shadow-2xl relative flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold flex items-center gap-2 text-slate-800">
                    <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    詠唱歷史紀錄
                </h2>
                <button onclick="toggleHistory()" class="text-slate-400 hover:text-slate-600 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="historyListContainer" class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-2"></div>
        </div>
    </div>

    <!-- 步驟進度條 (明亮風格) -->
    <div class="max-w-4xl mx-auto px-4 mt-8 mb-10">
        <div class="flex items-center justify-between relative">
            <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-slate-200 -z-10 rounded-full"></div>
            <div id="progressLine" class="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-amber-400 -z-10 rounded-full transition-all duration-500" style="width: 0%;"></div>
            
            <div class="step-indicator flex flex-col items-center gap-2" id="nav-step-1">
                <div class="w-10 h-10 rounded-full bg-amber-500 text-white flex items-center justify-center font-bold shadow-[0_0_15px_rgba(245,158,11,0.4)] border-4 border-white">1</div>
                <span class="text-xs font-bold text-amber-600">輸入構想</span>
            </div>
            <div class="step-indicator flex flex-col items-center gap-2 opacity-60" id="nav-step-1-5">
                <div class="w-10 h-10 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold border-4 border-white">2</div>
                <span class="text-xs font-bold text-slate-500">組建智囊團</span>
            </div>
            <div class="step-indicator flex flex-col items-center gap-2 opacity-60" id="nav-step-2">
                <div class="w-10 h-10 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold border-4 border-white">3</div>
                <span class="text-xs font-bold text-slate-500">宗師會診</span>
            </div>
            <div class="step-indicator flex flex-col items-center gap-2 opacity-60" id="nav-step-3">
                <div class="w-10 h-10 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold border-4 border-white">4</div>
                <span class="text-xs font-bold text-slate-500">終極詠唱</span>
            </div>
        </div>
    </div>

    <!-- 主要內容區塊 -->
    <main class="max-w-4xl mx-auto px-4 pb-20 relative">
        <div id="loadingOverlay" class="hidden absolute inset-0 z-40 bg-white/80 backdrop-blur-sm flex-col items-center justify-center rounded-3xl min-h-[300px]">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mb-4"></div>
            <p class="text-amber-600 font-bold animate-pulse" id="loadingText">與零一神經網路同步中...</p>
        </div>

        <!-- Step 1: 輸入構想 + 附件上傳 -->
        <section id="step-1" class="block bg-white rounded-3xl p-8 border border-slate-200 shadow-xl shadow-slate-200/50">
            <h2 class="text-2xl font-bold mb-2 flex items-center gap-2 text-slate-800"><span>💡</span> 寫下您的初步構想</h2>
            <p class="text-slate-500 text-sm mb-4">請用白話文描述需求。您可以點擊下方迴紋針附加圖片或 PDF 作為參考資料。</p>
            
            <div class="relative mb-6">
                <textarea id="ideaInput" rows="6" class="w-full bg-slate-50 border border-slate-300 rounded-2xl p-4 pb-12 text-slate-800 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 resize-none transition" placeholder="例如：我想結合附圖中的技術指標，寫一支選股條件..."></textarea>
                
                <!-- 優雅的上傳按鈕與狀態顯示 -->
                <div class="absolute bottom-3 left-4 flex items-center gap-3">
                    <input type="file" id="fileInput" accept="image/*,.pdf" class="hidden" onchange="handleFileChange(event)">
                    <button onclick="document.getElementById('fileInput').click()" class="text-slate-400 hover:text-amber-500 transition flex items-center gap-1 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm text-sm font-medium">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                        附加檔案
                    </button>
                    <div id="fileStatus" class="hidden items-center gap-2 bg-amber-50 text-amber-700 px-3 py-1.5 rounded-lg text-sm border border-amber-200 font-medium">
                        <span id="fileNameDisplay" class="truncate max-w-[150px]"></span>
                        <button onclick="clearFile()" class="hover:text-red-500 ml-1 font-bold">×</button>
                    </div>
                </div>
            </div>

            <div class="flex justify-end">
                <button onclick="processStep1()" class="px-8 py-3.5 bg-blue-600 hover:bg-blue-500 rounded-xl text-white font-bold transition shadow-lg shadow-blue-600/30 flex items-center gap-2">
                    下一步：召喚領域宗師
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </section>

        <!-- Step 1.5: 智囊團名單 -->
        <section id="step-1-5" class="hidden bg-white rounded-3xl p-8 border border-slate-200 shadow-xl shadow-slate-200/50">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-2xl font-bold flex items-center gap-2 text-slate-800"><span>👥</span> 跨時空重量級智囊團</h2>
                <span id="expertCountBadge" class="text-xs bg-blue-100 text-blue-700 border border-blue-200 px-3 py-1 rounded-full font-mono font-bold">已就位</span>
            </div>
            <p class="text-slate-500 text-sm mb-4">零一副指揮官已為您集結下列泰斗。可手動追加指名其他傳奇人物。</p>
            
            <div id="expertsList" class="space-y-3 mb-6 max-h-[480px] overflow-y-auto pr-2 custom-scrollbar"></div>
            
            <div class="mt-4 p-5 bg-slate-50 rounded-2xl border border-slate-200">
                <label class="block text-sm font-bold text-slate-700 mb-2">需要追加或微調嗎？（選填）</label>
                <input type="text" id="customExpertInput" placeholder="例如：追加一位「賈伯斯」負責介面體驗" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-slate-800 focus:outline-none focus:border-amber-400">
            </div>
            <div class="flex justify-between mt-8">
                <button onclick="goToStep(1)" class="px-6 py-3 text-slate-500 hover:bg-slate-100 rounded-xl transition font-bold">上一步</button>
                <button onclick="processStep1_5()" class="px-8 py-3.5 bg-blue-600 hover:bg-blue-500 rounded-xl text-white font-bold transition shadow-lg shadow-blue-600/30">確認名單，開始會診</button>
            </div>
        </section>

        <!-- Step 2: 宗師會診提問 -->
        <section id="step-2" class="hidden bg-white rounded-3xl p-8 border border-slate-200 shadow-xl shadow-slate-200/50">
            <h2 class="text-2xl font-bold mb-2 flex items-center gap-2 text-slate-800"><span>⚔️</span> 宗師核心提問</h2>
            <p class="text-slate-500 text-sm mb-4">智囊天團閉門研商後，提出以下問題以收斂開發規格。</p>
            <div id="questionsContainer" class="space-y-6 mb-8 mt-4"></div>
            <div class="flex justify-between">
                <button onclick="goToStep(2)" class="px-6 py-3 text-slate-500 hover:bg-slate-100 rounded-xl transition font-bold">上一步</button>
                <button onclick="processStep2()" class="px-8 py-3.5 bg-amber-500 hover:bg-amber-400 rounded-xl text-white font-bold transition shadow-lg shadow-amber-500/30">提交回答，生成詠唱</button>
            </div>
        </section>

        <!-- Step 3 & 4: 終極詠唱輸出 -->
        <section id="step-3" class="hidden bg-white rounded-3xl p-8 border border-slate-200 shadow-xl shadow-slate-200/50 border-t-8 border-t-amber-500">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold flex items-center gap-2 text-amber-600"><span>✨</span> 終極詠唱已準備就緒</h2>
                <div class="flex gap-2">
                    <button onclick="downloadPrompt()" class="px-4 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-xl text-sm font-bold transition flex items-center gap-2 border border-blue-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        下載 TXT
                    </button>
                    <button onclick="copyPrompt()" id="copyBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-sm font-bold transition flex items-center gap-2 shadow-lg">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        一鍵複製
                    </button>
                </div>
            </div>
            <div class="bg-slate-50 rounded-2xl p-5 border border-slate-200 relative">
                <pre id="finalPromptOutput" class="text-slate-700 font-mono text-sm whitespace-pre-wrap overflow-x-auto no-scrollbar max-h-[500px] overflow-y-auto leading-relaxed"></pre>
            </div>
            <div class="flex justify-center mt-8">
                <button onclick="location.reload()" class="px-6 py-3 text-slate-400 hover:text-slate-600 transition flex items-center gap-2 font-bold">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    開啟新專案
                </button>
            </div>
        </section>
    </main>

    <script>
        let state = {
            apiKey: localStorage.getItem('gemini_api_key') || '',
            idea: '',
            expertsText: '',
            questions: [],
            promptHistory: JSON.parse(localStorage.getItem('prompt_wizard_history') || '[]'),
            attachment: null // 存放 Base64 檔案資料
        };

        window.onload = () => {
            if (!state.apiKey) toggleSettings();
            document.getElementById('apiKeyInput').value = state.apiKey;
        };

        // --- 介面控制 ---
        function toggleSettings() { document.getElementById('settingsModal').classList.toggle('hidden'); }
        function toggleHistory() { renderHistory(); document.getElementById('historyModal').classList.toggle('hidden'); }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                state.apiKey = key;
                toggleSettings();
                alert('安全機制啟動：API 金鑰已加密儲存於本機端！');
            } else { alert('請輸入有效的金鑰'); }
        }

        // --- 附件上傳處理 (Base64) ---
        function handleFileChange(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 檔案大小限制 (4MB)，避免瀏覽器記憶體過載
            if (file.size > 4 * 1024 * 1024) {
                alert("檔案過大！為確保分析順暢，請上傳小於 4MB 的圖片或 PDF。");
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const base64Data = e.target.result.split(',')[1];
                state.attachment = {
                    mimeType: file.type,
                    data: base64Data,
                    name: file.name
                };
                document.getElementById('fileNameDisplay').innerText = file.name;
                document.getElementById('fileStatus').classList.remove('hidden');
                document.getElementById('fileStatus').classList.add('flex');
            };
            reader.readAsDataURL(file);
        }

        function clearFile() {
            state.attachment = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('fileStatus').classList.add('hidden');
            document.getElementById('fileStatus').classList.remove('flex');
        }

        // --- 歷史紀錄 ---
        function renderHistory() {
            const container = document.getElementById('historyListContainer');
            if(state.promptHistory.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-slate-400 font-medium">尚無任何詠唱紀錄，請先完成一次生成。</div>';
                return;
            }
            container.innerHTML = state.promptHistory.map((item, idx) => `
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-between items-center gap-4 hover:border-amber-300 transition">
                    <div class="flex-1 overflow-hidden">
                        <p class="text-xs text-amber-600 font-bold mb-1">${item.time}</p>
                        <p class="text-sm text-slate-600 truncate">${item.text.substring(0, 40).replace(/\n/g, ' ')}...</p>
                    </div>
                    <button onclick="copyFromHistory(${idx}, this)" class="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-100 rounded-lg text-sm font-bold transition whitespace-nowrap text-slate-700 shadow-sm">
                        複製
                    </button>
                </div>
            `).join('');
        }

        function copyFromHistory(idx, btnEl) {
            navigator.clipboard.writeText(state.promptHistory[idx].text).then(() => {
                const origText = btnEl.innerText;
                btnEl.innerText = '✅ 已複製';
                btnEl.classList.add('text-amber-600', 'border-amber-200', 'bg-amber-50');
                setTimeout(() => {
                    btnEl.innerText = origText;
                    btnEl.classList.remove('text-amber-600', 'border-amber-200', 'bg-amber-50');
                }, 2000);
            });
        }

        // --- 載入與進度切換 ---
        function showLoading(text) {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('loadingOverlay').classList.add('flex');
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('loadingOverlay').classList.remove('flex');
        }
        function updateProgress(stepNum) {
            const percentages = {1: '0%', 2: '33%', 3: '66%', 4: '100%'};
            document.getElementById('progressLine').style.width = percentages[stepNum];
            const maps = {1: 'nav-step-1', 2: 'nav-step-1-5', 3: 'nav-step-2', 4: 'nav-step-3'};
            for(let i=1; i<=4; i++) {
                const el = document.getElementById(maps[i]);
                const circle = el.querySelector('div');
                const text = el.querySelector('span');
                if(i <= stepNum) {
                    el.classList.remove('opacity-60');
                    circle.classList.remove('bg-slate-200', 'text-slate-500');
                    circle.classList.add('bg-amber-500', 'text-white');
                    text.classList.remove('text-slate-500');
                    text.classList.add('text-amber-600');
                    if(i === stepNum) circle.classList.add('shadow-[0_0_15px_rgba(245,158,11,0.4)]');
                    else circle.classList.remove('shadow-[0_0_15px_rgba(245,158,11,0.4)]');
                } else {
                    el.classList.add('opacity-60');
                    circle.classList.remove('bg-amber-500', 'text-white', 'shadow-[0_0_15px_rgba(245,158,11,0.4)]');
                    circle.classList.add('bg-slate-200', 'text-slate-500');
                    text.classList.add('text-slate-500');
                    text.classList.remove('text-amber-600');
                }
            }
        }
        function goToStep(targetStep) {
            const maps = {1: 'step-1', 2: 'step-1-5', 3: 'step-2', 4: 'step-3'};
            for(let i=1; i<=4; i++) document.getElementById(maps[i]).classList.add('hidden');
            document.getElementById(maps[targetStep]).classList.remove('hidden');
            updateProgress(targetStep);
        }

        // --- API 核心通訊 (支援附件發送) ---
        async function callGemini(prompt, isJsonMode = false) {
            if (!state.apiKey) { toggleSettings(); throw new Error("No API Key"); }
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${state.apiKey}`;
            
            let finalPrompt = prompt;
            if (isJsonMode) finalPrompt += `\n\n**CRITICAL: You MUST output ONLY valid JSON. Do NOT wrap in markdown blockquotes like \`\`\`json. Just the raw JSON.**`;

            // 組合發送內容，若有附件則一併送出
            const parts = [{ text: finalPrompt }];
            if (state.attachment) {
                parts.push({
                    inlineData: {
                        mimeType: state.attachment.mimeType,
                        data: state.attachment.data
                    }
                });
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: parts }],
                        generationConfig: { temperature: 0.2 }
                    })
                });

                if (!response.ok) throw new Error((await response.json()).error.message || 'API 呼叫失敗');
                
                const data = await response.json();
                let textResult = data.candidates[0].content.parts[0].text;
                if (isJsonMode) return JSON.parse(textResult.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim());
                return textResult;
            } catch (error) {
                alert("API 發生錯誤：" + error.message);
                throw error;
            }
        }

        // --- 流程控制 ---
        async function processStep1() {
            const idea = document.getElementById('ideaInput').value.trim();
            if (!idea && !state.attachment) return alert("指揮官，請先輸入您的構想或上傳參考附件！");
            state.idea = idea;
            
            showLoading("零一正在進行時空躍傳，分析需求並集結 5-10 位大師...");
            
            const prompt = `使用者想開發的專案構想為：「${idea}」。${state.attachment ? '使用者有提供一份附加檔案作為參考。' : ''}
請依據此專案的複雜度與專業跨度，精準挑選並組建一支包含【5 到 10 位成員】的重量級智囊團。

【名單成員嚴格規範】：
1. 第一位絕對固定為：「🤖 零一 (副指揮官)」，代表 Gemini 的旗艦級邏輯分析與全域戰術統籌。
2. 必須包含 1 到 2 位頂尖 AI 模型角色：例如「🧠 Claude 3.5 Sonnet」、「💻 GPT-4o」。
3. 必須包含 3 到 7 位「真實存在的歷史頂尖偉人」或「當代傳奇大師」。
格式必須是純 JSON 陣列，每個物件包含 "name" (稱號與姓名) 和 "reason" (約25字的核心價值)。`;

            try {
                const experts = await callGemini(prompt, true);
                const listEl = document.getElementById('expertsList');
                listEl.innerHTML = '';
                state.expertsText = "";
                
                experts.forEach((exp, idx) => {
                    state.expertsText += `${idx + 1}. 【${exp.name}】: ${exp.reason}\n`;
                    listEl.innerHTML += `
                        <div class="flex items-start gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200 hover:border-amber-400 transition shadow-sm">
                            <div class="bg-white text-amber-500 p-2.5 rounded-xl text-lg flex items-center justify-center shrink-0 border border-slate-200 shadow-sm">🏛️</div>
                            <div>
                                <h4 class="font-bold text-slate-800 text-base tracking-wide">${exp.name}</h4>
                                <p class="text-sm text-slate-500 mt-1 leading-relaxed">${exp.reason}</p>
                            </div>
                        </div>`;
                });
                
                document.getElementById('expertCountBadge').innerText = `${experts.length} 位宗師已就位`;
                hideLoading();
                goToStep(2); 
            } catch (e) { hideLoading(); }
        }

        async function processStep1_5() {
            const customInput = document.getElementById('customExpertInput').value.trim();
            let finalExpertsContext = state.expertsText;
            if (customInput) finalExpertsContext += `\n使用者另外追加要求: ${customInput}`;
            
            showLoading("5-10位大師閉門聯合研商中，提煉 4-5 個核心提問...");
            
            const prompt = `專案構想：「${state.idea}」。${state.attachment ? '使用者有提供一份附加檔案作為參考。' : ''}
目前的智囊團名單：${finalExpertsContext}

請從中推派最關鍵的代表（包含副指揮官零一），提出【4 到 5 個最致命、能釐清開發規格】的核心提問。
- 零一必須以「【零一 (副指揮官)】：報告指揮官！」開頭。
- 其他大師必須依據其歷史人物性格或 AI 特長提問。
格式必須是 JSON 陣列字串。`;

            try {
                state.questions = await callGemini(prompt, true);
                const qContainer = document.getElementById('questionsContainer');
                qContainer.innerHTML = '';
                state.questions.forEach((q, index) => {
                    qContainer.innerHTML += `
                        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 border-l-4 border-l-blue-500 shadow-sm">
                            <label class="block font-bold text-slate-800 mb-3 text-sm leading-relaxed">
                                <span class="text-blue-600 mr-2 text-base">Q${index + 1}.</span>${q}
                            </label>
                            <textarea id="answer-${index}" rows="2" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-slate-800 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 text-sm transition" placeholder="請指揮官在此輸入決策..."></textarea>
                        </div>`;
                });
                hideLoading();
                goToStep(3); 
            } catch (e) { hideLoading(); }
        }

        async function processStep2() {
            let qaContext = "";
            for (let i = 0; i < state.questions.length; i++) {
                const ans = document.getElementById(`answer-${i}`).value.trim() || '無特別意見';
                qaContext += `Q: ${state.questions[i]}\nA: ${ans}\n\n`;
            }
            showLoading("零一正在統合大師見解，鍛造終極詠唱...");

            const prompt = `你現在是頂尖的 AI 提示詞工程師(Prompt Engineer)。
【原始構想】：${state.idea}
【專家與使用者對答釐清】：\n${qaContext}
請轉譯並濃縮成一段「完美、結構化、可直接餵給一般 AI 模型」的 System Prompt。
包含：1. 指定角色 2. 任務目標 3. 架構與限制 4. 輸出要求。直接給出要用來複製貼上的 Prompt 內容，不要問候語。`;

            try {
                const finalPrompt = await callGemini(prompt, false);
                document.getElementById('finalPromptOutput').innerText = finalPrompt;
                
                const now = new Date();
                const timeString = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                state.promptHistory.unshift({ text: finalPrompt, time: timeString });
                if (state.promptHistory.length > 50) state.promptHistory.pop();
                localStorage.setItem('prompt_wizard_history', JSON.stringify(state.promptHistory));

                hideLoading();
                goToStep(4); 
            } catch (e) { hideLoading(); }
        }

        // --- 匯出與複製 ---
        function downloadPrompt() {
            const text = document.getElementById('finalPromptOutput').innerText;
            if (!text) return;
            let prefix = text.replace(/[\r\n\t]/g, '').trim().substring(0, 5).replace(/[\\/:*?"<>|]/g, '');
            if(!prefix) prefix = "未命名";
            const filename = `詠唱紀錄_${prefix}.txt`;
            
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function copyPrompt() {
            const text = document.getElementById('finalPromptOutput').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '✅ 已複製';
                btn.classList.replace('bg-slate-800', 'bg-amber-500');
                btn.classList.replace('hover:bg-slate-700', 'hover:bg-amber-400');
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.replace('bg-amber-500', 'bg-slate-800');
                    btn.classList.replace('hover:bg-amber-400', 'hover:bg-slate-700');
                }, 2000);
            });
        }
    </script>
</body>
</html>
