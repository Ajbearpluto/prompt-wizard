<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Wizard | 終極詠唱精靈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: {
                    sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-focus:focus-within {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
        }
        .loader {
            border-top-color: #3b82f6;
            -webkit-animation: spinner 1s linear infinite;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen w-full flex overflow-hidden selection:bg-blue-500/30">

    <!-- API 設定 Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-md z-[100] flex items-center justify-center">
        <div class="bg-zinc-900 p-6 rounded-2xl border border-zinc-700 w-full max-w-md shadow-2xl relative">
            <h2 class="text-lg font-bold text-white mb-4">⚙️ 設定 API 能源金鑰</h2>
            <p class="text-sm text-zinc-400 mb-4">系統需綁定 Gemini API 以驅動宗師會診。金鑰僅加密儲存於本機瀏覽器。</p>
            <input type="password" id="apiKeyInput" placeholder="輸入 AIzaSy..." class="w-full bg-zinc-950 border border-zinc-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500 mb-6">
            <div class="flex justify-end gap-3">
                <button onclick="toggleSettings()" class="px-4 py-2 rounded-xl text-zinc-400 hover:text-white transition">取消</button>
                <button onclick="saveApiKey()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl text-white font-bold transition shadow-lg shadow-blue-500/20">鎖定並儲存</button>
            </div>
        </div>
    </div>

    <!-- 左側：記憶宮殿側邊欄 -->
    <aside class="w-80 glass-panel flex flex-col border-r border-zinc-800/50 z-10 relative">
        <div class="p-6 border-b border-zinc-800/50 flex justify-between items-center">
            <h1 class="text-lg font-semibold tracking-wide flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse shadow-[0_0_8px_rgba(59,130,246,0.8)]"></span>
                Memory Palace
            </h1>
            <button onclick="toggleSettings()" class="text-zinc-500 hover:text-white transition" title="API 設定">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>
        
        <div id="history-container" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- 歷史紀錄動態載入 -->
        </div>
    </aside>

    <!-- 主工作區 -->
    <main class="flex-1 flex flex-col md:flex-row h-full relative">
        
        <!-- 全域載入遮罩 -->
        <div id="loadingOverlay" class="hidden absolute inset-0 z-40 bg-zinc-950/80 backdrop-blur-sm flex-col items-center justify-center">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-zinc-700 h-12 w-12 mb-4"></div>
            <p class="text-blue-400 font-medium animate-pulse" id="loadingText">與零一神經網路同步中...</p>
        </div>

        <!-- 創作與會診區 (中欄) -->
        <section class="flex-1 flex flex-col p-8 border-r border-zinc-800/50 relative">
            
            <!-- 狀態 1：輸入構想 -->
            <div id="state-input" class="flex-1 flex flex-col h-full">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-white mb-1">💡 提示詞鑄造區</h2>
                    <p class="text-sm text-zinc-400">寫下您的原始需求，我們將為您轉譯為機器最易懂的語言。</p>
                </div>
                <div class="flex-1 relative glow-focus transition-all duration-300 rounded-2xl glass-panel flex flex-col">
                    <textarea 
                        id="ideaInput"
                        class="w-full flex-1 bg-transparent p-6 text-zinc-200 resize-none focus:outline-none text-base leading-relaxed"
                        placeholder="例如：我想結合太極系統的 20MA 跟 60MA 來寫一支選股條件..."
                    ></textarea>
                </div>
                <div class="mt-6 flex justify-end">
                    <button onclick="startConsultation()" class="px-8 py-3.5 bg-blue-600 hover:bg-blue-500 rounded-xl text-white font-bold transition shadow-lg shadow-blue-900/30 flex items-center gap-2">
                        召喚智囊團會診
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </div>

            <!-- 狀態 2：宗師會診提問 -->
            <div id="state-consult" class="hidden flex-1 flex flex-col h-full">
                <div class="mb-6 flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold text-white mb-1">⚔️ 宗師會診中</h2>
                        <p class="text-sm text-zinc-400">請回答大師們的核心提問，以收斂最終規格。</p>
                    </div>
                    <button onclick="resetToInput()" class="text-sm text-zinc-500 hover:text-white transition">取消重來</button>
                </div>
                <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                    <div id="questionsContainer" class="space-y-6"></div>
                </div>
                <div class="mt-6 flex justify-end">
                    <button onclick="forgeUltimatePrompt()" class="px-8 py-3.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-white font-bold transition shadow-lg shadow-emerald-900/30 flex items-center gap-2">
                        ✨ 鍛造終極詠唱
                    </button>
                </div>
            </div>
        </section>

        <!-- 終極詠唱輸出區 (右欄) -->
        <section class="flex-1 flex flex-col p-8 bg-black/20">
            <div class="mb-6 flex justify-between items-end">
                <h2 class="text-2xl font-bold text-white mb-1">Final Prompt</h2>
                <button id="copy-btn" onclick="copyToClipboard()" class="group relative px-5 py-2.5 font-medium text-white bg-zinc-800 rounded-xl transition hover:bg-zinc-700 flex items-center gap-2 overflow-hidden border border-zinc-700">
                    <span id="copy-text" class="relative z-10 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        一鍵複製
                    </span>
                </button>
            </div>

            <div class="flex-1 glass-panel rounded-2xl p-6 overflow-y-auto relative">
                <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-zinc-600 pointer-events-none">
                    <svg class="w-12 h-12 mb-3 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    <p class="text-sm">等待智囊團鍛造，轉譯為 AI 專屬語言</p>
                </div>
                <pre id="preview-output" class="font-mono text-sm text-zinc-300 whitespace-pre-wrap leading-relaxed hidden"></pre>
            </div>
        </section>
    </main>

    <!-- 微互動 Toast 提示 -->
    <div id="toast" class="fixed bottom-8 right-8 px-6 py-3 bg-zinc-800 text-white rounded-xl shadow-2xl border border-zinc-700/50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 z-50">
        <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
        <span class="text-sm font-medium">已複製至剪貼簿！</span>
    </div>

    <!-- 🌟 神經網路連結：引入剛剛拆分出來的 app.js -->
    <script src="js/app.js"></script>

</body>
</html>
