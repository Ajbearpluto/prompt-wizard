<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Wizard | 終極詠唱精靈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: {
                    sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
                }
            }
        }
    </script>
    <style>
        /* 隱藏原生捲軸，打造極簡體驗 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
        
        /* 毛玻璃與發光特效 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-focus:focus-within {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen w-full flex overflow-hidden selection:bg-blue-500/30">

    <!-- 左側：記憶宮殿側邊欄 -->
    <aside class="w-80 glass-panel flex flex-col border-r border-zinc-800/50 z-10 relative">
        <div class="p-6 border-b border-zinc-800/50 flex justify-between items-center">
            <h1 class="text-lg font-semibold tracking-wide flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse shadow-[0_0_8px_rgba(59,130,246,0.8)]"></span>
                Memory Palace
            </h1>
            <span class="text-xs text-zinc-500 flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                已同步
            </span>
        </div>
        
        <!-- 分類過濾器 -->
        <div class="px-6 py-4 flex gap-2 overflow-x-auto no-scrollbar">
            <button class="px-3 py-1 text-xs rounded-full bg-white/10 text-white hover:bg-white/20 transition">全部</button>
            <button class="px-3 py-1 text-xs rounded-full border border-zinc-700 text-zinc-400 hover:text-white hover:border-zinc-500 transition">金融</button>
            <button class="px-3 py-1 text-xs rounded-full border border-zinc-700 text-zinc-400 hover:text-white hover:border-zinc-500 transition">教育</button>
            <button class="px-3 py-1 text-xs rounded-full border border-zinc-700 text-zinc-400 hover:text-white hover:border-zinc-500 transition">程式</button>
        </div>

        <!-- 歷史卡片流 -->
        <div id="history-container" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- 卡片由 JS 動態生成 -->
        </div>
    </aside>

    <!-- 右側：主工作區 (輸入與預覽) -->
    <main class="flex-1 flex flex-col md:flex-row h-full">
        
        <!-- 創作輸入區 -->
        <section class="flex-1 flex flex-col p-8 border-r border-zinc-800/50">
            <div class="mb-6 flex justify-between items-end">
                <div>
                    <h2 class="text-2xl font-bold text-white mb-1">提示詞鑄造區</h2>
                    <p class="text-sm text-zinc-400">寫下您的構想，右側將即時渲染最終詠唱。</p>
                </div>
                <button onclick="clearEditor()" class="text-sm text-zinc-500 hover:text-white transition flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    清空
                </button>
            </div>

            <div class="flex-1 relative glow-focus transition-all duration-300 rounded-2xl glass-panel flex flex-col">
                <textarea 
                    id="prompt-editor"
                    class="w-full flex-1 bg-transparent p-6 text-zinc-200 resize-none focus:outline-none text-base leading-relaxed"
                    placeholder="請在此輸入您的系統提示詞或原始構想..."
                    oninput="handleInput()"
                ></textarea>
                
                <!-- 底部工具列 -->
                <div class="p-4 border-t border-zinc-800/50 flex justify-between items-center bg-black/20 rounded-b-2xl">
                    <div class="flex gap-2">
                        <button class="p-2 text-zinc-400 hover:text-blue-400 transition rounded-lg hover:bg-white/5" title="插入變數 {{var}}">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                        </button>
                    </div>
                    <span class="text-xs text-zinc-500 font-mono" id="char-count">0 words</span>
                </div>
            </div>
        </section>

        <!-- 即時預覽區 -->
        <section class="flex-1 flex flex-col p-8 bg-black/20">
            <div class="mb-6 flex justify-between items-end">
                <h2 class="text-2xl font-bold text-white mb-1">Live Preview</h2>
                
                <button id="copy-btn" onclick="copyToClipboard()" class="group relative px-5 py-2.5 font-medium text-white bg-blue-600 rounded-xl transition hover:bg-blue-500 flex items-center gap-2 overflow-hidden shadow-lg shadow-blue-900/20">
                    <span id="copy-text" class="relative z-10 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        一鍵複製
                    </span>
                    <div class="absolute inset-0 bg-emerald-500 transform scale-x-0 group-active:scale-x-100 transition-transform origin-left duration-200"></div>
                </button>
            </div>

            <div class="flex-1 glass-panel rounded-2xl p-6 overflow-y-auto relative">
                <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-zinc-600 pointer-events-none">
                    <svg class="w-12 h-12 mb-3 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    <p class="text-sm">等待輸入，即時渲染魔法</p>
                </div>
                <pre id="preview-output" class="font-mono text-sm text-zinc-300 whitespace-pre-wrap leading-relaxed hidden"></pre>
            </div>
        </section>
    </main>

    <!-- 微互動 Toast 提示 -->
    <div id="toast" class="fixed bottom-8 right-8 px-6 py-3 bg-zinc-800 text-white rounded-xl shadow-2xl border border-zinc-700/50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 z-50">
        <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
        <span class="text-sm font-medium">已複製至剪貼簿！</span>
    </div>

    <script>
        // 預設記憶宮殿資料
        const historyData = [
            {
                id: 1,
                title: "太極系統 20MA/60MA 策略",
                tags: ["金融", "程式"],
                date: "2 mins ago",
                content: "# Role\n你是一位精通台指期與技術分析的量化交易專家。\n\n# Task\n以太極系統（聖盃系統）為基礎，結合 15 分鐘與 60 分鐘 K 線，利用 20MA 與 60MA 的黃金交叉/死亡交叉，撰寫一支 MultiCharts 語法的選股條件腳本。\n\n# Constraints\n- 需加入 VIX 波動率過濾條件。\n- 支援 OCO 條件單出場機制。"
            },
            {
                id: 2,
                title: "小勇士跨校閱讀與 SEL 教案",
                tags: ["教育", "寫作"],
                date: "2 hours ago",
                content: "# Role\n你是一位具備十年經驗的創新國小教師，精通數位學習與跨校共備。\n\n# Task\n請為班上的「小勇士」們設計一份結合社會情緒學習 (SEL) 框架的跨校閱讀理解教案。需使用多文本閱讀策略。\n\n# Output\n- 提供 WQSA 學習單範本。\n- 包含一份使用生成式 AI 輔助評量的 Rubrics (評量尺規)。"
            }
        ];

        const editor = document.getElementById('prompt-editor');
        const preview = document.getElementById('preview-output');
        const emptyState = document.getElementById('empty-state');
        const charCount = document.getElementById('char-count');

        // 渲染記憶宮殿
        function renderHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = historyData.map(item => `
                <div class="group bg-white/5 hover:bg-white/10 border border-white/5 hover:border-white/10 rounded-xl p-4 cursor-pointer transition-all duration-300 relative overflow-hidden" onclick="applyHistory(${item.id})">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-sm font-semibold text-zinc-200 group-hover:text-blue-400 transition">${item.title}</h3>
                    </div>
                    <p class="text-xs text-zinc-500 line-clamp-2 mb-3">${item.content}</p>
                    <div class="flex justify-between items-center">
                        <div class="flex gap-1.5">
                            ${item.tags.map(tag => `<span class="px-2 py-0.5 text-[10px] bg-zinc-800/80 text-zinc-400 rounded-md border border-zinc-700/50">${tag}</span>`).join('')}
                        </div>
                        <span class="text-[10px] text-zinc-600">${item.date}</span>
                    </div>
                    <!-- 一鍵套用微動效 -->
                    <div class="absolute inset-0 bg-blue-500/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-[2px]">
                        <span class="text-sm font-bold text-white drop-shadow-md flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                            點擊套用
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // 即時預覽處理
        function handleInput() {
            const text = editor.value;
            charCount.textContent = `${text.length} words`;
            
            if (text.trim() === '') {
                preview.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                preview.classList.remove('hidden');
                // 基礎 Markdown 高亮處理 (簡單實作)
                let formatted = text
                    .replace(/^(# .*$)/gm, '<span class="text-blue-400 font-bold">$1</span>')
                    .replace(/^(- .*$)/gm, '<span class="text-zinc-400">$1</span>')
                    .replace(/(\{\{.*?\}\})/g, '<span class="bg-amber-500/20 text-amber-300 px-1 rounded">$1</span>');
                preview.innerHTML = formatted;
            }
        }

        // 套用歷史紀錄
        function applyHistory(id) {
            const data = historyData.find(item => item.id === id);
            if (data) {
                editor.value = data.content;
                handleInput();
                
                // 視覺反饋
                editor.classList.add('bg-blue-500/10');
                setTimeout(() => editor.classList.remove('bg-blue-500/10'), 300);
            }
        }

        // 清空編輯區
        function clearEditor() {
            editor.value = '';
            handleInput();
        }

        // 一鍵複製與微型 Toast
        function copyToClipboard() {
            const text = editor.value;
            if(!text) return;

            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn');
                const copyText = document.getElementById('copy-text');
                const toast = document.getElementById('toast');
                
                // 按鈕狀態變更
                btn.classList.add('bg-emerald-600', 'shadow-emerald-900/20');
                btn.classList.remove('bg-blue-600', 'shadow-blue-900/20');
                copyText.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 複製成功';
                
                // Toast 動畫
                toast.classList.remove('translate-y-20', 'opacity-0');
                
                setTimeout(() => {
                    btn.classList.remove('bg-emerald-600', 'shadow-emerald-900/20');
                    btn.classList.add('bg-blue-600', 'shadow-blue-900/20');
                    copyText.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg> 一鍵複製';
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 2000);
            });
        }

        // 初始渲染
        renderHistory();
    </script>
</body>
</html>
